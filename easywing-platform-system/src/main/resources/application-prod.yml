server:
  port: 8083

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

easywing:
  security:
    oauth2:
      jwt:
        jwk-set-uri: ${JWK_SET_URI}
        issuer-uri: ${ISSUER_URI}
  user:
    default-password: ${DEFAULT_PASSWORD}

management:
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.easywing: INFO
