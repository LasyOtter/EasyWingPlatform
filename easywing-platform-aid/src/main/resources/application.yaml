server:
  port: ${AID_SERVER_PORT:8086}
  shutdown: graceful
  tomcat:
    threads:
      virtual: true

spring:
  application:
    name: aid-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/easywing_aid?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: AidServiceHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
        shutdown-timeout: 100ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

easywing:
  aid:
    # 任务队列：redis-stream（默认）| local（无 Redis 降级，对应 NFR-9 / FR-10.9）
    queue:
      type: ${AID_QUEUE_TYPE:redis-stream}
      stream-key: ${AID_QUEUE_STREAM:aid:tasks}
      group: ${AID_QUEUE_GROUP:aid-workers}
      consumer-threads: ${AID_QUEUE_THREADS:2}
      batch-size: ${AID_QUEUE_BATCH:32}
      block-timeout-ms: ${AID_QUEUE_BLOCK_MS:2000}
      poll-interval-ms: ${AID_QUEUE_POLL_MS:200}
      reclaim-interval-ms: ${AID_QUEUE_RECLAIM_INTERVAL_MS:30000}
      reclaim-min-idle-ms: ${AID_QUEUE_RECLAIM_MIN_IDLE_MS:60000}
      dedup-ttl-seconds: ${AID_QUEUE_DEDUP_TTL:86400}
      max-len: ${AID_QUEUE_MAX_LEN:100000}

    # FFmpeg：成片合成、配音对位、字幕烧录、首尾帧抽取
    ffmpeg:
      enabled: ${AID_FFMPEG_ENABLED:true}
      binary-path: ${AID_FFMPEG_BIN:ffmpeg}
      probe-path: ${AID_FFMPEG_PROBE:ffprobe}
      work-dir: ${AID_FFMPEG_WORK_DIR:${java.io.tmpdir}/easywing-aid}
      timeout-ms: ${AID_FFMPEG_TIMEOUT_MS:300000}
      default-resolution: ${AID_FFMPEG_RESOLUTION:1280x720}
      default-frame-rate: ${AID_FFMPEG_FPS:25}
      video-bitrate: ${AID_FFMPEG_BITRATE:2M}
      audio-sample-rate: ${AID_FFMPEG_AUDIO_RATE:44100}
      subtitle-font: ${AID_FFMPEG_SUB_FONT:Microsoft YaHei}
      subtitle-font-size: ${AID_FFMPEG_SUB_SIZE:22}

    # 参考图/产物存储：M1 用本地磁盘 + 静态资源端点，生产换对象存储只改实现
    storage:
      enabled: ${AID_STORAGE_ENABLED:true}
      base-dir: ${AID_STORAGE_DIR:${java.io.tmpdir}/easywing-aid/assets}
      public-path: /api/v1/aid/assets/files
      max-file-size: ${AID_STORAGE_MAX_SIZE:20971520}
      allowed-extensions: jpg,jpeg,png,webp,gif

  data:
    audit-enabled: ${AID_AUDIT_ENABLED:true}
    # 多租户：M1 先关闭。TenantLineInnerInterceptor 在 tenantEnabled=true 且
    # TenantContext 无值时会退化为 tenant_id = 0，导致所有数据互不可见，
    # 因此开启前必须先接入 JWT tenant_id claim → TenantContext 的过滤器。
    tenant-enabled: ${AID_TENANT_ENABLED:false}

  security:
    public-paths:
      - /actuator/**
      - /api/v1/aid/health
      - /swagger-ui/**
      - /v3/api-docs/**
    oauth2:
      jwt:
        jwk-set-uri: ${JWK_SET_URI:http://auth-service/.well-known/jwks.json}
        authorities-claim-name: roles
        username-claim-name: preferred_username

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.easywing.platform.aid: INFO
