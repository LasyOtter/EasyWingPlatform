{{- if .Values.infra.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "easywing.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: {{ .Values.infra.redis.serviceType }}
  selector:
    app.kubernetes.io/name: {{ include "easywing.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: {{ .Values.infra.redis.port }}
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "easywing.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "easywing.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "easywing.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ include "easywing.image" .Values.infra.redis }}
          imagePullPolicy: {{ include "easywing.pullPolicy" . }}
          command: ["sh", "-c"]
          args:
            - |
              exec redis-server --appendonly yes {{ if .Values.infra.redis.password }}--requirepass "$REDIS_PASSWORD"{{ end }}
          ports:
            - name: redis
              containerPort: {{ .Values.infra.redis.port }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easywing-secrets
                  key: REDIS_PASSWORD
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: easywing-config
                  key: TZ
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli {{ if .Values.infra.redis.password }}-a \"$REDIS_PASSWORD\"{{ end }} ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli {{ if .Values.infra.redis.password }}-a \"$REDIS_PASSWORD\"{{ end }} ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          {{- with .Values.infra.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.infra.redis.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
      {{- else }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
---
{{- if .Values.infra.redis.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    {{- include "easywing.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - {{ .Values.infra.redis.persistence.accessMode | quote }}
  storageClassName: {{ include "easywing.storageClass" . }}
  resources:
    requests:
      storage: {{ .Values.infra.redis.persistence.size | quote }}
{{- end }}
{{- end }}