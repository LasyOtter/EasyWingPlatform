apiVersion: v1
kind: Secret
metadata:
  name: easywing-secrets
  labels:
    {{- include "easywing.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.infra.mysql.rootPassword | quote }}
  MYSQL_USER: {{ .Values.infra.mysql.user | quote }}
  MYSQL_PASSWORD: {{ .Values.infra.mysql.password | quote }}
  REDIS_PASSWORD: {{ .Values.infra.redis.password | quote }}
  NACOS_AUTH_TOKEN: {{ .Values.infra.nacos.authToken | quote }}
  NACOS_MYSQL_PASSWORD: {{ .Values.infra.nacos.mysql.password | default .Values.infra.mysql.rootPassword | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  USER_PASSWORD: {{ .Values.secrets.userPassword | quote }}
  DEFAULT_PASSWORD: {{ .Values.secrets.defaultPassword | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureApiKey | quote }}
  AZURE_OPENAI_BASE_URL: {{ .Values.secrets.azureBaseUrl | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.secrets.azureApiVersion | quote }}
  AZURE_OPENAI_DEPLOYMENT: {{ .Values.secrets.azureDeployment | quote }}
  RESPONSES_API_KEY: {{ .Values.secrets.responsesApiKey | quote }}
  RESPONSES_API_BASE_URL: {{ .Values.secrets.responsesBaseUrl | quote }}
  VERTEX_AI_ACCESS_TOKEN: {{ .Values.secrets.vertexAccessToken | quote }}
  VERTEX_AI_BASE_URL: {{ .Values.secrets.vertexBaseUrl | quote }}
  BEDROCK_ACCESS_KEY: {{ .Values.secrets.bedrockAccessKey | quote }}
  BEDROCK_SECRET_KEY: {{ .Values.secrets.bedrockSecretKey | quote }}
  BEDROCK_SESSION_TOKEN: {{ .Values.secrets.bedrockSessionToken | quote }}
  BEDROCK_REGION: {{ .Values.secrets.bedrockRegion | quote }}
  LDAP_MANAGER_PASSWORD: {{ .Values.secrets.ldapManagerPassword | quote }}
  EMAIL_SMTP_PASSWORD: {{ .Values.secrets.emailSmtpPassword | quote }}