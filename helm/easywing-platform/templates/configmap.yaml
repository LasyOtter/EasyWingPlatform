apiVersion: v1
kind: ConfigMap
metadata:
  name: easywing-config
  labels:
    {{- include "easywing.labels" . | nindent 4 }}
data:
  TZ: {{ .Values.global.timezone | quote }}
  NACOS_SERVER_ADDR: "nacos:8848"
  NACOS_NAMESPACE: {{ .Values.global.nacosNamespace | quote }}
  NACOS_GROUP: {{ .Values.global.nacosGroup | quote }}
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  AUTH_SERVICE_URL: "http://auth-service:8085"
  SYSTEM_SERVICE_URL: "http://system-service:8083"
  AI_SERVICE_URL: "http://ai-service:8082"
  LED_SERVICE_URL: "http://led-service:8084"