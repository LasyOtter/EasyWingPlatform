{{- if .Values.services.led.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.led.name }}
  labels:
    {{- include "easywing.labels" . | nindent 4 }}
    app.kubernetes.io/component: led
spec:
  type: {{ .Values.services.led.serviceType }}
  selector:
    app.kubernetes.io/name: {{ include "easywing.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: led
  ports:
    - name: http
      port: {{ .Values.services.led.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.led.name }}
  labels:
    {{- include "easywing.labels" . | nindent 4 }}
    app.kubernetes.io/component: led
spec:
  replicas: {{ .Values.services.led.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "easywing.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: led
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "easywing.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: led
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: led
          image: {{ include "easywing.image" .Values.services.led }}
          imagePullPolicy: {{ include "easywing.pullPolicy" . }}
          ports:
            - name: http
              containerPort: {{ .Values.services.led.port }}
          envFrom:
            - configMapRef:
                name: easywing-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JAVA_OPTS
              value: {{ .Values.services.led.javaOpts | quote }}
            {{- range $k, $v := .Values.services.led.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easywing-secrets
                  key: REDIS_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: easywing-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easywing-secrets
                  key: MYSQL_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 80
            periodSeconds: 20
            timeoutSeconds: 5
          {{- with .Values.services.led.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}