{{- if .Values.infra.nacos.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: nacos
  labels:
    {{- include "easywing.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos
spec:
  type: {{ .Values.infra.nacos.serviceType }}
  selector:
    app.kubernetes.io/name: {{ include "easywing.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nacos
  ports:
    - name: http
      port: {{ .Values.infra.nacos.port }}
      targetPort: http
    - name: grpc
      port: {{ .Values.infra.nacos.grpcPort }}
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  labels:
    {{- include "easywing.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "easywing.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nacos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "easywing.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nacos
    spec:
      containers:
        - name: nacos
          image: {{ include "easywing.image" .Values.infra.nacos }}
          imagePullPolicy: {{ include "easywing.pullPolicy" . }}
          ports:
            - name: http
              containerPort: {{ .Values.infra.nacos.port }}
            - name: grpc
              containerPort: {{ .Values.infra.nacos.grpcPort }}
          env:
            - name: MODE
              value: standalone
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: easywing-secrets
                  key: NACOS_AUTH_TOKEN
            - name: NACOS_AUTH_IDENTITY_KEY
              value: {{ .Values.infra.nacos.identityKey | quote }}
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: {{ .Values.infra.nacos.identityValue | quote }}
            - name: SPRING_DATASOURCE_PLATFORM
              value: mysql
            - name: MYSQL_SERVICE_HOST
              value: {{ .Values.infra.nacos.mysql.host | quote }}
            - name: MYSQL_SERVICE_PORT
              value: {{ .Values.infra.nacos.mysql.port | quote }}
            - name: MYSQL_SERVICE_DB_NAME
              value: {{ .Values.infra.nacos.mysql.database | quote }}
            - name: MYSQL_SERVICE_USER
              value: {{ .Values.infra.nacos.mysql.user | quote }}
            - name: MYSQL_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easywing-secrets
                  key: NACOS_MYSQL_PASSWORD
            - name: MYSQL_SERVICE_DB_PARAM
              value: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone={{ .Values.global.timezone }}"
            - name: JVM_XMS
              value: {{ .Values.infra.nacos.jvmXms | quote }}
            - name: JVM_XMX
              value: {{ .Values.infra.nacos.jvmXmx | quote }}
            - name: JVM_XMN
              value: {{ .Values.infra.nacos.jvmXmn | quote }}
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: easywing-config
                  key: TZ
          readinessProbe:
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          {{- with .Values.infra.nacos.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes: []
{{- end }}