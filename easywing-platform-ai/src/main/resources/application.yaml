spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: ai-service
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
        shutdown-timeout: 100ms

# AI Configuration
easywing:
  ai:
    enabled: true

    # Agent 定义管理（PRD 4.2）：默认内存存储；多实例共享改为 redis
    agent-def:
      enabled: ${AI_AGENT_DEF_ENABLED:true}
      storage-type: ${AI_AGENT_DEF_STORAGE_TYPE:memory}
      default-visibility: ${AI_AGENT_DEF_DEFAULT_VISIBILITY:PRIVATE}
      max-tools-per-agent: ${AI_AGENT_DEF_MAX_TOOLS:50}
      max-skills-per-agent: ${AI_AGENT_DEF_MAX_SKILLS:20}
      max-shared-users: ${AI_AGENT_DEF_MAX_SHARED_USERS:100}
      max-shared-groups: ${AI_AGENT_DEF_MAX_SHARED_GROUPS:50}

    # Provider Configuration
    providers:
      openai:
        enabled: true
        type: openai
        apiKey: ${OPENAI_API_KEY:}
        baseUrl: https://api.openai.com/v1
        model: gpt-4o
        temperature: 0.7
        maxTokens: 4096

      anthropic:
        enabled: false
        type: anthropic
        apiKey: ${ANTHROPIC_API_KEY:}
        baseUrl: https://api.anthropic.com/v1
        model: claude-3-5-sonnet-20241022
        temperature: 0.7
        maxTokens: 4096

      google:
        enabled: false
        type: google
        apiKey: ${GOOGLE_API_KEY:}
        baseUrl: https://generativelanguage.googleapis.com/v1beta/models
        model: gemini-2.0-flash-exp
        temperature: 0.7
        maxTokens: 2048

    # Azure OpenAI：与公共 OpenAI 的鉴权头（api-key）和 deployment 路径不同，故单独配置。
    # 默认关闭；apiKey 只经环境变量/配置注入，禁止硬编码。
    azure:
      enabled: ${AZURE_OPENAI_ENABLED:false}
      api-key: ${AZURE_OPENAI_API_KEY:}
      base-url: ${AZURE_OPENAI_BASE_URL:}
      api-version: ${AZURE_OPENAI_API_VERSION:2024-06-01}
      deployment: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o}
      # 对外暴露的逻辑模型名清单；留空时回退到 OpenAI 常用模型
      models:
        - gpt-4o
        - gpt-4o-mini

    # OpenAI Responses API：与 Chat Completions 不同的官方协议（POST /v1/responses）。
    # 默认关闭；apiKey 只经环境变量/配置注入，禁止硬编码。
    responses:
      enabled: ${RESPONSES_API_ENABLED:false}
      api-key: ${RESPONSES_API_KEY:}
      base-url: ${RESPONSES_API_BASE_URL:https://api.openai.com/v1}
      # 对外暴露的逻辑模型名清单；留空时回退到 Responses API 常用模型
      models: ${RESPONSES_API_MODELS:}

    # Vertex AI（Gemini on Vertex）：与 Google AI Studio 共用 Gemini 线协议，但用 OAuth2 访问令牌鉴权。
    # baseUrl 需指向 .../locations/<region>/publishers/google/models；默认关闭，令牌只经环境变量注入。
    vertex:
      enabled: ${VERTEX_AI_ENABLED:false}
      access-token: ${VERTEX_AI_ACCESS_TOKEN:}
      base-url: ${VERTEX_AI_BASE_URL:}
      # 对外暴露的逻辑模型名清单；留空时回退到 Gemini 常用模型
      models: ${VERTEX_AI_MODELS:}

    # AWS Bedrock（Converse / ConverseStream）：使用 AWS SDK v2 官方客户端，签名与 event-stream 解码由 SDK 负责。
    # 默认关闭；accessKey/secretKey 只经环境变量/配置注入，禁止硬编码。
    bedrock:
      enabled: ${BEDROCK_ENABLED:false}
      region: ${BEDROCK_REGION:us-east-1}
      access-key: ${BEDROCK_ACCESS_KEY:}
      secret-key: ${BEDROCK_SECRET_KEY:}
      session-token: ${BEDROCK_SESSION_TOKEN:}
      # 覆盖端点（本地模拟或 VPC 内部地址），留空使用 https://bedrock-runtime.<region>.amazonaws.com
      endpoint: ${BEDROCK_ENDPOINT:}
      # 对外暴露的逻辑模型名清单；留空时回退到常用 Bedrock 模型
      models: ${BEDROCK_MODELS:}

    # OpenAI-compatible custom endpoints can be added here without changing service code.
    custom-endpoints:
      deepseek:
        enabled: ${DEEPSEEK_ENABLED:false}
        name: DeepSeek
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        api-key: ${DEEPSEEK_API_KEY:}
        models:
          - deepseek-chat

    # 多模态图片理解（PRD 4.6）：把 ChatMessage.contentParts 中的图片交给视觉模型，
    # 由 Provider 序列化为各家协议（OpenAI / Anthropic / Gemini）。默认开启，
    # 但需要至少一个 supportsVision 的模型可用；AUDIO/VIDEO/DOCUMENT 会显式报错而非返回模拟数据。
    multimodal:
      enabled: ${AI_MULTIMODAL_ENABLED:true}
      default-model: ${AI_MULTIMODAL_MODEL:gpt-4o}
      detail: ${AI_MULTIMODAL_DETAIL:high}

    # 文生图 / 图生图（PRD 4.6）：走 OpenAI 兼容的 /images/generations 与 /images/editions，
    # provider 可指向 providers 中的 OpenAI 兼容端点或 customEndpoints 中的任意兼容服务
    # （Stable Diffusion WebUI / Flux 等）。默认关闭，密钥只经环境变量/配置注入。
    image-generation:
      enabled: ${AI_IMAGE_GENERATION_ENABLED:false}
      provider: ${AI_IMAGE_GENERATION_PROVIDER:openai}
      default-model: ${AI_IMAGE_GENERATION_MODEL:gpt-image-1}
      models: ${AI_IMAGE_GENERATION_MODELS:}
      default-size: ${AI_IMAGE_GENERATION_SIZE:1024x1024}
      default-n: ${AI_IMAGE_GENERATION_N:1}
      max-n: ${AI_IMAGE_GENERATION_MAX_N:4}
      timeout-ms: ${AI_IMAGE_GENERATION_TIMEOUT_MS:120000}

    mcp:
      # MCP server 配置：名称 -> 传输配置（http 或 stdio）
      servers: {}
      # 旧版令牌配置（可选，优先级低于 server 内的 bearer-token）
      server-tokens: {}
      # 示例（stdio 本地子进程）：
      # servers:
      #   filesystem:
      #     type: stdio
      #     command: ${MCP_FS_COMMAND:npx}
      #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
      #     env:
      #       API_KEY: ${MCP_FS_API_KEY:}
      #     allowed-tenants: [default]
      #     allowed-roles: [ROLE_USER]
      #     timeout-seconds: 30
      # 示例（http 远程服务）：
      #   remote:
      #     type: http
      #     url: ${MCP_REMOTE_URL:}
      #     bearer-token: ${MCP_REMOTE_TOKEN:}

    # Memory Configuration
    # type=redis 需要可用 Redis；memory 仅用于本地开发（重启丢失，集群不共享）
    memory:
      enabled: true
      type: ${AI_MEMORY_TYPE:memory}
      maxMessages: 100
      ttlHours: 24
      summaryThreshold: 20

    # Session Configuration
    # storageType=redis 需要可用 Redis；memory 仅用于本地开发
    session:
      enabled: true
      storageType: ${AI_SESSION_STORAGE:memory}
      defaultTtlSeconds: 86400
      maxConversationsPerUser: 100

    # 会话共享链接（PRD 4.7 / 5.2）：默认关闭，密钥不参与；限流与上限可配
    # storageType=redis 时多实例共享；memory 仅用于本地开发
    share:
      enabled: ${AI_SHARE_ENABLED:false}
      storageType: ${AI_SHARE_STORAGE:memory}
      defaultTtlHours: 168
      maxTtlHours: 720
      maxLinksPerSession: 5
      rateLimitPerMinute: 30
      maxMessages: 500

    # Compression Configuration
    compression:
      enabled: true
      strategy: smart
      targetTokens: 8000
      compressionRatio: 0.5
      # 压缩时完整保留的最近消息条数（不含 system 消息）
      keepLastMessages: 6

    # Gateway Configuration
    gateway:
      enabled: true
      port: 8082
      apiPrefix: /api/v1/ai

    # Knowledge Base Configuration
    knowledgeBase:
      enabled: false
      vectorStore: milvus
      collectionName: easywing_knowledge
      topK: 5
      similarityThreshold: 0.7

    # Embedding 配置：调用 OpenAI 兼容 /embeddings 端点；未配置 apiKey 时回退模拟向量
    embedding:
      provider: openai
      model: text-embedding-3-small
      # apiKey: ${OPENAI_API_KEY:}
      # baseUrl: https://api.openai.com/v1
      batchSize: 32
      dimension: 1536

    # 代码沙箱：mode=process 仅用于开发；生产必须使用 docker
    sandbox:
      mode: process
      maxExecutionTime: 10000
      maxMemoryMB: 512
      maxOutputSize: 10240
      allowNetworkAccess: false
      allowFileSystemAccess: false

    # Agent Configuration
    agent:
      maxIterations: 10
      maxToolCallsPerIteration: 5
      toolCallTimeoutMs: 30000
      streamingEnabled: true

    # Skill Configuration
    skill:
      enabled: true
      scanPackage: com.easywing.platform.ai.skill
      # storage-type=redis 让多实例共享技能目录；memory 仅用于本地开发（重启丢失，集群不共享）
      storage-type: ${AI_SKILL_STORAGE:memory}

    # Prompt Library Configuration（Prompt 库）
    prompt:
      enabled: true
      # storage-type=redis 让多实例共享同一份 Prompt 库；memory 仅用于本地开发（重启丢失，集群不共享）
      storage-type: ${AI_PROMPT_STORAGE:memory}

    # Session Search Configuration（消息全文搜索）
    session-search:
      enabled: true
      # 单次搜索返回的最大命中条数
      max-results: ${AI_SEARCH_MAX_RESULTS:50}
      # 命中片段的最大长度
      snippet-length: ${AI_SEARCH_SNIPPET_LENGTH:160}

    # Context Usage Panel（上下文占用面板，PRD 4.8）
    context-usage:
      enabled: true
      # 模型目录缺 contextWindow 时的兜底窗口
      default-context-window: ${AI_CONTEXT_WINDOW:128000}

    # Usage Ledger Configuration（Token / 成本账本）
    usage:
      # 账本存储：redis 让多实例共享同一份用量与成本统计；memory 仅本实例（默认）
      storage-type: ${AI_USAGE_STORAGE:memory}
      # 最多保留的用量记录条数（超出按时间淘汰最旧记录）
      max-records: ${AI_USAGE_MAX_RECORDS:10000}

    # Agent Trace Configuration（DebugService 执行追踪）
    trace:
      # 追踪存储：redis 让多实例共享同一份 Agent 执行链路；memory 仅本实例（默认）
      storage-type: ${AI_TRACE_STORAGE:memory}
      # 最多保留的追踪条数（超出按开始时间淘汰最旧记录）
      max-records: ${AI_TRACE_MAX_RECORDS:1000}
      # 终态追踪导出：none（默认，不导出）/ langfuse / otel
      exporter: ${AI_TRACE_EXPORTER:none}

    # Langfuse 链路摄取配置（exporter=langfuse 时生效）
    langfuse:
      # 例：https://cloud.langfuse.com ；自建实例填 http://<host>:3000
      base-url: ${LANGFUSE_BASE_URL:}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
      # 连接与请求超时（毫秒）
      timeout-ms: ${LANGFUSE_TIMEOUT_MS:2000}

    # WebSocket Configuration
    websocket:
      # 是否校验握手令牌。Spring Security 的 @EnableWebSecurity 只覆盖 servlet HTTP，
      # 不拦截 WebSocket 握手，因此这里在握手阶段独立校验。
      requireToken: true
      allowed-origins:
        - http://localhost:8080

    # 联网检索流水线（搜索提供商 → 内容抓取器 → 结果重排器）
    # 默认关闭；启用需同时提供提供商密钥，密钥只经配置或环境变量注入
    web-search:
      enabled: ${AI_WEB_SEARCH_ENABLED:false}
      provider: serper
      serper-base-url: https://google.serper.dev
      serper-api-key: ${SERPER_API_KEY:}
      max-results: 5
      fetch-limit: 5
      max-content-chars: 20000
      fetch-content: true
      jina:
        enabled: ${AI_JINA_ENABLED:false}
        base-url: https://api.jina.ai/v1
        api-key: ${JINA_API_KEY:}
        model: jina-reranker-v2-base-multilingual

  # 资源服务器配置，与 system 服务保持同一前缀与形状
  security:
    public-paths:
      - /actuator/**
      - /api/v1/ai/health
      - /api/v1/ai/shared/**
      - /swagger-ui/**
      - /v3/api-docs/**
    oauth2:
      jwt:
        jwk-set-uri: ${JWK_SET_URI:http://auth-service/.well-known/jwks.json}
        authorities-claim-name: roles
        username-claim-name: preferred_username

# Server Configuration
server:
  port: ${AI_SERVER_PORT:8082}
  servlet:
    context-path: /

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.easywing.platform.ai: INFO
    com.easywing.platform.ai.provider: INFO
    com.easywing.platform.ai.agent: INFO
