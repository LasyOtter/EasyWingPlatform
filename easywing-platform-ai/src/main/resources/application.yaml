spring:
  application:
    name: ai-service
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
        shutdown-timeout: 100ms

# AI Configuration
easywing:
  ai:
    enabled: true

    # Provider Configuration
    providers:
      openai:
        enabled: true
        type: openai
        apiKey: ${OPENAI_API_KEY:}
        baseUrl: https://api.openai.com/v1
        model: gpt-4o
        temperature: 0.7
        maxTokens: 4096

      anthropic:
        enabled: false
        type: anthropic
        apiKey: ${ANTHROPIC_API_KEY:}
        baseUrl: https://api.anthropic.com/v1
        model: claude-3-5-sonnet-20241022
        temperature: 0.7
        maxTokens: 4096

      google:
        enabled: false
        type: google
        apiKey: ${GOOGLE_API_KEY:}
        baseUrl: https://generativelanguage.googleapis.com/v1beta/models
        model: gemini-2.0-flash-exp
        temperature: 0.7
        maxTokens: 2048

    # Memory Configuration
    memory:
      enabled: true
      type: redis
      maxMessages: 100
      ttlHours: 24
      summaryThreshold: 20

    # Session Configuration
    session:
      enabled: true
      storageType: redis
      defaultTtlSeconds: 86400
      maxConversationsPerUser: 100

    # Compression Configuration
    compression:
      enabled: true
      strategy: smart
      targetTokens: 8000
      compressionRatio: 0.5

    # Gateway Configuration
    gateway:
      enabled: true
      port: 8082
      apiPrefix: /api/v1/ai

    # Knowledge Base Configuration
    knowledgeBase:
      enabled: false
      vectorStore: milvus
      collectionName: easywing_knowledge
      topK: 5
      similarityThreshold: 0.7

    # Embedding 配置：调用 OpenAI 兼容 /embeddings 端点；未配置 apiKey 时回退模拟向量
    embedding:
      provider: openai
      model: text-embedding-3-small
      # apiKey: ${OPENAI_API_KEY:}
      # baseUrl: https://api.openai.com/v1
      batchSize: 32
      dimension: 1536

    # 代码沙箱：mode=process 仅用于开发；生产必须使用 docker
    sandbox:
      mode: process
      maxExecutionTime: 10000
      maxMemoryMB: 512
      maxOutputSize: 10240
      allowNetworkAccess: false
      allowFileSystemAccess: false

    # Agent Configuration
    agent:
      maxIterations: 10
      maxToolCallsPerIteration: 5
      toolCallTimeoutMs: 30000
      streamingEnabled: true

    # Skill Configuration
    skill:
      enabled: true
      scanPackage: com.easywing.platform.ai.skill

    # WebSocket Configuration
    websocket:
      allowed-origins:
        - http://localhost:8080

# Server Configuration
server:
  port: ${AI_SERVER_PORT:8082}
  servlet:
    context-path: /

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.easywing.platform.ai: INFO
    com.easywing.platform.ai.provider: INFO
    com.easywing.platform.ai.agent: INFO
