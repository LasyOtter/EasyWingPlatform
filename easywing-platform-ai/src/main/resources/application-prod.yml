---
# 生产环境：关闭 API 文档暴露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}

easywing:
  ai:
    session:
      storage-type: redis
    memory:
      type: redis
    skill:
      storage-type: redis
    usage:
      storage-type: redis
    trace:
      storage-type: redis
    # 多实例共享的目录类状态一并落到 Redis（PRD 5.3 无状态后端、4.7 租户与共享隔离）：
    # Agent 定义、Prompt 库、会话共享链接、Attached Workspaces。
    # custom-endpoint-store 刻意保持 memory：Redis 模式会把 apiKey 明文写入 Redis，
    # 需由运维显式设置 AI_CUSTOM_ENDPOINT_STORAGE=redis 并确保 Redis 受 ACL/TLS 保护。
    agent-def:
      storage-type: redis
    prompt:
      storage-type: redis
    share:
      storage-type: redis
    workspace:
      storage-type: redis
    responses:
      enabled: ${RESPONSES_API_ENABLED:false}
      api-key: ${RESPONSES_API_KEY:}
      base-url: ${RESPONSES_API_BASE_URL:https://api.openai.com/v1}
      models: ${RESPONSES_API_MODELS:}
    vertex:
      enabled: ${VERTEX_AI_ENABLED:false}
      access-token: ${VERTEX_AI_ACCESS_TOKEN:}
      base-url: ${VERTEX_AI_BASE_URL:}
      models: ${VERTEX_AI_MODELS:}
    bedrock:
      enabled: ${BEDROCK_ENABLED:false}
      region: ${BEDROCK_REGION:us-east-1}
      access-key: ${BEDROCK_ACCESS_KEY:}
      secret-key: ${BEDROCK_SECRET_KEY:}
      session-token: ${BEDROCK_SESSION_TOKEN:}
      endpoint: ${BEDROCK_ENDPOINT:}
      models: ${BEDROCK_MODELS:}

management:
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: INFO
    com.easywing.platform.ai: INFO
