---
# 生产环境：关闭 API 文档暴露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}

management:
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: INFO
    com.easywing.platform.ai: INFO
