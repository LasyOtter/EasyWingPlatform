# EasyWing Platform - Local Development Environment
# Usage: docker-compose up -d

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: easywing-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: easywing_platform
      MYSQL_USER: easywing
      MYSQL_PASSWORD: easywing123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - easywing-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: easywing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - easywing-network

  # Nacos Registry & Config Center
  nacos:
    image: nacos/nacos-server:v3.3.0
    container_name: easywing-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      # Nacos 3 鉴权 token，生产环境必须通过环境变量注入，勿使用默认值
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-changeme}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root123456
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8081:8080"
      - "8848:8848"
      - "9848:9848"
    depends_on:
      - mysql
    networks:
      - easywing-network

  # EasyWing Auth Service
  auth-service:
    build:
      context: .
      dockerfile: easywing-platform-auth/Dockerfile
    image: easywing/auth-service:1.0.0
    container_name: easywing-auth-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_DISCOVERY_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass@123}
      USER_PASSWORD: ${USER_PASSWORD:-UserPass@123}
      JWT_KEY_PATH: /app/keys
    volumes:
      - auth_keys:/app/keys
    ports:
      - "8085:8085"
    depends_on:
      - redis
      - nacos
    networks:
      - easywing-network

  # EasyWing System Service
  system-service:
    build:
      context: .
      dockerfile: easywing-platform-system/Dockerfile
    image: easywing/system-service:1.0.0
    container_name: easywing-system-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: jdbc:mysql://mysql:3306/easywing_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root123456
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-AdminPass@123}
      JWK_SET_URI: ${JWK_SET_URI:-http://auth-service:8085/.well-known/jwks.json}
      ISSUER_URI: ${ISSUER_URI:-http://auth-service:8085}
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - redis
      - auth-service
    networks:
      - easywing-network

  # EasyWing AI Service
  ai-service:
    build:
      context: .
      dockerfile: easywing-platform-ai/Dockerfile
    image: easywing/ai-service:1.0.0
    container_name: easywing-ai-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_DISCOVERY_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8082:8082"
    depends_on:
      - redis
      - nacos
    networks:
      - easywing-network

  # EasyWing API Gateway
  gateway:
    build:
      context: .
      dockerfile: easywing-platform-gateway/Dockerfile
    image: easywing/gateway:1.0.0
    container_name: easywing-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_DISCOVERY_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://auth-service:8085/.well-known/jwks.json}
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - nacos
      - auth-service
      - system-service
      - ai-service
    networks:
      - easywing-network

  # Sentinel Dashboard
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: easywing-sentinel
    restart: unless-stopped
    ports:
      - "8858:8858"
    networks:
      - easywing-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: easywing-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - easywing-network

  # RocketMQ (optional)
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.0
    container_name: easywing-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    networks:
      - easywing-network

  rocketmq-broker:
    image: apache/rocketmq:5.1.0
    container_name: easywing-rocketmq-broker
    restart: unless-stopped
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876
    depends_on:
      - rocketmq-namesrv
    networks:
      - easywing-network

  # Zipkin Tracing (optional)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: easywing-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - easywing-network

  # Prometheus Monitoring (optional)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: easywing-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - easywing-network

  # Grafana Dashboard (optional)
  grafana:
    image: grafana/grafana:10.2.2
    container_name: easywing-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123456
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - easywing-network

networks:
  easywing-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  auth_keys:
