server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/easywing_led?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379

easywing:
  security:
    oauth2:
      jwt:
        jwk-set-uri: ${JWK_SET_URI:http://localhost:8085/.well-known/jwks.json}
  led:
    base-dir: ${LED_BASE_DIR:.}
    file-config-enabled: true

logging:
  level:
    com.easywing: DEBUG
    org.springframework.security: DEBUG
